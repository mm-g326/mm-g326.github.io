<!DOCTYPE html>
<html lang="ja">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex,nofollow">
    <title>Yusei Tomobe Portfolio</title>
    <!--
        転送専用のページ。ポートフォリオ本体は https://mm-g326.github.io/Portfolio/ にある（大文字のP）。
        https://mm-g326.github.io/ や、その下のページ（例: /work-detail.html?id=2512EZ2）に来た人を、
        /Portfolio/ の同じページへ送る。小文字で /portfolio/… と打った人もここに来るので、同じく送る。
        index.html と 404.html は同じ中身。
    -->
    <script>
        (function () {
            var base = '/Portfolio';
            // 先頭の /portfolio（大文字・小文字を問わない）は取り除いてから付け直す
            var path = location.pathname.replace(/^\/portfolio(?=\/|$)/i, '') || '/';
            location.replace(base + path + location.search + location.hash);
        })();
    </script>
    <!-- JavaScript が動かない環境向けの保険 -->
    <meta http-equiv="refresh" content="0; url=/Portfolio/">
</head>

<body>
    <p><a href="/Portfolio/">Yusei Tomobe Portfolio へ移動します</a></p>
</body>

</html>
